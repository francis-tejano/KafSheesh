services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafsheesh-kafka
    hostname: kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: kafsheesh-postgres
    environment:
      POSTGRES_USER: kafsheesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kafsheesh}
      POSTGRES_DB: kafsheesh
    volumes:
      - kafsheesh_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafsheesh -d kafsheesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    container_name: kafsheesh-api
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      PORT: "4000"
      KAFSHEESH_DATA_DIR: /data
      KAFSHEESH_COMPOSE_KAFKA_HOST: kafka
      KAFSHEESH_MASTER_KEY: ${KAFSHEESH_MASTER_KEY:-change-me-in-production}
      KAFSHEESH_TLS_REJECT_UNAUTHORIZED: ${KAFSHEESH_TLS_REJECT_UNAUTHORIZED:-true}
      KAFSHEESH_DISABLE_DESTRUCTIVE: ${KAFSHEESH_DISABLE_DESTRUCTIVE:-true}
      DATABASE_URL: postgres://kafsheesh:${POSTGRES_PASSWORD:-kafsheesh}@postgres:5432/kafsheesh
    volumes:
      - kafsheesh_data:/data
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build:
      context: .
      target: web
    container_name: kafsheesh-web
    ports:
      - "${KAFSHEESH_WEB_PORT:-4444}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:
  kafsheesh_data:
  kafsheesh_pg:
